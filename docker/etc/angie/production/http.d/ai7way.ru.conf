server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    acme ai7way;
    ssl_certificate $acme_cert_ai7way;
    ssl_certificate_key $acme_cert_key_ai7way;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name ai7way.ru;
    root /var/www/static/ai7way_ru;
    index index.html;
    charset utf-8;
    add_header X-Angie-Deployment "docker-production" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
